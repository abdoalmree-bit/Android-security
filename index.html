
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار أمان الهاتف</title>
</head>
<body>
<h2>اختبار معلومات الجهاز</h2>
<p>هذه تجربة محلية آمنة. المعلومات لا تُرسل إلى أي جهة.</p>
<pre id="info">جارٍ الفحص...</pre>
<script>
const info = {
  "المتصفح والجهاز": navigator.userAgent,
  "لغة الجهاز": navigator.language,
  "النظام المعلن": navigator.platform,
  "دقة الشاشة": screen.width + " × " + screen.height,
  "المنطقة الزمنية": Intl.DateTimeFormat().resolvedOptions().timeZone,
  "اتصال آمن": location.protocol === "https:"
};
document.getElementById("info").textContent =
  JSON.stringify(info, null, 2);
</script>
</body>
</html>
